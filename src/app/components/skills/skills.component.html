<section id="conocimientos" class="section-shell">
  <h3 class="section-title">{{ portfolioService.language() === 'es' ? 'Conocimientos' : 'Skills' }}</h3>

  <div class="skill-groups">
    @for (group of portfolioService.content.skillGroups; track portfolioService.t(group.title)) {
      <article>
        <h4>{{ portfolioService.t(group.title) }}</h4>
        <ul>
          @for (skill of group.skills; track skill) {
            <li>{{ skill }}</li>
          }
        </ul>
      </article>
    }
  </div>
</section>

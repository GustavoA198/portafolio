<article class="project-card">
  <img [src]="project().imageUrl" [alt]="portfolioService.t(project().title)" loading="lazy" />

  <div class="body">
    <h4>{{ portfolioService.t(project().title) }}</h4>
    <p>{{ portfolioService.t(project().description) }}</p>

    <ul>
      @for (tag of project().tags; track tag) {
        <li>{{ tag }}</li>
      }
    </ul>

    <div class="actions">
      <a [href]="project().demoUrl" target="_blank" rel="noopener">
        {{ portfolioService.language() === 'es' ? 'Demo' : 'Live' }}
      </a>
      <a [href]="project().repoUrl" target="_blank" rel="noopener">GitHub</a>
    </div>
  </div>
</article>

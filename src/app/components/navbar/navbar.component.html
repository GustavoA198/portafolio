<header class="topbar">
  <a class="brand" href="#inicio" aria-label="Ir al inicio">
    <span class="brand-mark">///</span>
    <span class="brand-name">GAGA</span>
  </a>

  <nav class="nav-links" aria-label="Main navigation">
    @for (item of portfolioService.navigation(); track item.href) {
      <a [href]="item.href">{{ item.label }}</a>
    }
  </nav>

  <div class="lang-switch" role="group" aria-label="Language switcher">
    <button
      type="button"
      [class.active]="portfolioService.language() === 'es'"
      (click)="portfolioService.setLanguage('es')"
    >
      ES
    </button>
    <button
      type="button"
      [class.active]="portfolioService.language() === 'en'"
      (click)="portfolioService.setLanguage('en')"
    >
      EN
    </button>
  </div>
</header>

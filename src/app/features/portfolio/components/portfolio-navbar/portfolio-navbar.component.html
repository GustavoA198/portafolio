<a
  class="sr-only focus:not-sr-only focus:fixed focus:left-4 focus:top-3 focus:z-50 focus:rounded focus:bg-ink focus:px-4 focus:py-2 focus:text-paper"
  href="#main"
>
  {{ ui().skipLink }}
</a>

<header class="sticky top-0 z-40 border-b border-stroke bg-paper">
  <div class="mx-auto flex h-16 max-w-[72rem] items-center justify-between gap-6 px-4 sm:px-6">
    <a class="type-heading whitespace-nowrap text-base sm:text-lg" href="#top" [attr.aria-label]="ui().home" (click)="closeMenu()">Gustavo Gutiérrez</a>

    <nav class="hidden lg:block" [attr.aria-label]="ui().sectionsLabel">
      <ul class="flex gap-7 text-[0.9375rem]">
        @for (link of nav(); track link.href) {
          <li>
            <a class="text-graphite transition-colors hover:text-ink" [href]="link.href">{{ link.label }}</a>
          </li>
        }
      </ul>
    </nav>

    <div class="flex items-center gap-2">
      <a
        class="hidden items-center gap-1.5 rounded-full bg-ink px-3.5 py-1.5 text-sm font-semibold text-paper transition-colors hover:bg-signal hover:text-signal-ink sm:inline-flex"
        [href]="hero().cvHref"
        [attr.download]="hero().cvFileName"
        [attr.aria-label]="hero().cvLabel"
      >
        <app-icon name="download" [size]="15" />
        CV
      </a>
      <div class="flex rounded-full border border-stroke p-0.5 text-sm" role="group" [attr.aria-label]="ui().languageLabel">
        @for (code of langs; track code) {
          <button
            type="button"
            class="type-condensed rounded-full px-2.5 py-1 transition-colors"
            [class.bg-ink]="lang() === code"
            [class.text-paper]="lang() === code"
            [class.text-graphite]="lang() !== code"
            [attr.lang]="code"
            [attr.aria-pressed]="lang() === code"
            [attr.aria-label]="ui().languageNames[code]"
            (click)="setLang(code)"
          >
            {{ code.toUpperCase() }}
          </button>
        }
      </div>

      <button
        type="button"
        class="grid size-10 place-items-center rounded lg:hidden"
        aria-controls="mobile-nav"
        [attr.aria-expanded]="menuOpen()"
        [attr.aria-label]="menuOpen() ? ui().closeMenu : ui().openMenu"
        (click)="toggleMenu()"
      >
        <app-icon [name]="menuOpen() ? 'close' : 'menu'" [size]="22" />
      </button>
    </div>
  </div>

  <nav id="mobile-nav" class="border-t border-stroke lg:hidden" [hidden]="!menuOpen()" [attr.aria-label]="ui().sectionsLabel">
    <ul class="mx-auto max-w-[72rem] px-4 py-2 sm:px-6">
      @for (link of nav(); track link.href) {
        <li>
          <a class="type-heading block py-3 text-xl" [href]="link.href" (click)="closeMenu()">{{ link.label }}</a>
        </li>
      }
    </ul>
  </nav>
</header>

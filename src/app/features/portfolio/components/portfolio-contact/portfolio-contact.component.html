<section id="contact" class="border-t border-stroke" aria-labelledby="contact-heading">
  <div class="mx-auto grid max-w-[72rem] gap-10 px-4 py-20 sm:px-6 lg:grid-cols-12 lg:py-28">
    <h2 id="contact-heading" class="type-heading text-[2.125rem] lg:col-span-4">{{ contact().heading }}</h2>

    <div class="lg:col-span-8">
      <p class="max-w-[34rem] text-xl leading-relaxed text-graphite">{{ contact().text }}</p>

      <div class="mt-8 flex flex-wrap items-center gap-x-6 gap-y-4">
        <a
          class="text-[clamp(1.2rem,4.6vw,2.5rem)] font-semibold leading-tight text-signal underline decoration-1 underline-offset-[0.2em] [overflow-wrap:anywhere] hover:decoration-2"
          [href]="'mailto:' + contact().email"
        >
          {{ contact().email }}
        </a>
        <button
          type="button"
          class="inline-flex items-center gap-2 rounded border border-stroke px-3.5 py-2 text-[0.9375rem] font-semibold transition-colors hover:border-ink"
          (click)="copyEmail()"
        >
          <app-icon [name]="copyState() === 'copied' ? 'check' : 'copy'" [size]="17" />
          {{ copyState() === 'copied' ? contact().copiedLabel : contact().copyLabel }}
        </button>
      </div>
      <p class="mt-3 min-h-6 text-sm text-graphite" role="status">
        @if (copyState() === 'failed') {
          {{ contact().copyFailedLabel }}
        }
      </p>

      <ul class="mt-10 max-w-[38rem] border-t border-stroke">
        @for (link of contact().links; track link.href) {
          <li class="border-b border-stroke">
            <a
              class="group grid grid-cols-[1.5rem_1fr] items-center gap-x-4 py-4 sm:grid-cols-[1.5rem_8rem_1fr]"
              [href]="link.href"
              [attr.target]="link.external ? '_blank' : null"
              [attr.rel]="link.external ? 'noopener' : null"
            >
              <app-icon class="text-graphite group-hover:text-signal" [name]="link.icon" [size]="20" />
              <span class="type-condensed text-graphite">{{ link.label }}</span>
              <span class="col-start-2 font-semibold group-hover:text-signal group-hover:underline sm:col-start-auto">{{ link.value }}</span>
              @if (link.external) {
                <span class="sr-only">({{ newTab() }})</span>
              }
            </a>
          </li>
        }
      </ul>
    </div>
  </div>
</section>

<footer class="border-t border-stroke">
  <div class="mx-auto flex max-w-[72rem] flex-col gap-4 px-4 py-10 text-[0.9375rem] text-graphite sm:flex-row sm:items-center sm:justify-between sm:px-6">
    <p>© {{ year }} {{ footer().owner }}</p>
    <div class="flex flex-wrap gap-x-7 gap-y-2">
      <a class="inline-flex items-center gap-2 hover:text-ink" [href]="hero().cvHref" [attr.download]="hero().cvFileName">
        <app-icon name="download" [size]="16" />
        {{ footer().cvLabel }}
      </a>
      <a class="inline-flex items-center gap-2 hover:text-ink" href="#top">
        <app-icon name="arrow-up" [size]="16" />
        {{ footer().backToTop }}
      </a>
    </div>
  </div>
</footer>

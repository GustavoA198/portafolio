<section id="top" class="mx-auto max-w-[72rem] px-4 pb-20 pt-12 sm:px-6 lg:pb-28 lg:pt-20" aria-labelledby="hero-name">
  <h1 id="hero-name" class="type-display text-[clamp(2.6rem,8vw,4.75rem)] [text-wrap:balance]">
    {{ hero().firstName }} {{ hero().lastName }}
  </h1>

  <div class="mt-10 grid gap-14 lg:mt-14 lg:grid-cols-12 lg:gap-10">
    <div class="lg:col-span-5">
      <p class="type-heading text-[clamp(1.75rem,3.2vw,2.25rem)] [text-wrap:balance]">{{ hero().role }}</p>
      <p class="mt-5 max-w-[34rem] text-lg text-graphite">{{ hero().summary }}</p>
      <p class="type-condensed mt-5 inline-flex items-center gap-2 text-[0.9375rem]">
        <span class="size-2 rounded-full bg-signal" aria-hidden="true"></span>
        {{ hero().availability }}
      </p>

      <div class="mt-8 flex flex-wrap items-center gap-x-7 gap-y-4">
        <a
          class="inline-flex items-center gap-2.5 rounded bg-ink px-5 py-3.5 font-semibold text-paper transition-colors hover:bg-signal hover:text-signal-ink"
          [href]="hero().cvHref"
          [attr.download]="hero().cvFileName"
        >
          <app-icon name="download" [size]="18" />
          {{ hero().cvLabel }}
        </a>
        <a class="link font-semibold" href="#contact">{{ hero().contactLabel }}</a>
      </div>

      <ul class="mt-7 flex gap-2">
        @for (link of profileLinks(); track link.href) {
          <li>
            <a
              class="grid size-11 place-items-center rounded border border-stroke text-graphite transition-colors hover:border-ink hover:text-ink"
              [href]="link.href"
              target="_blank"
              rel="noopener"
              [attr.aria-label]="link.label + ' (' + newTab() + ')'"
            >
              <app-icon [name]="link.icon" [size]="20" />
            </a>
          </li>
        }
      </ul>
    </div>

    <div class="lg:col-span-7">
      <app-system-diagram [content]="diagram()" />
    </div>
  </div>
</section>

<section id="experience" class="border-t border-stroke" aria-labelledby="experience-heading">
  <div class="mx-auto grid max-w-[72rem] gap-10 px-4 py-20 sm:px-6 lg:grid-cols-12 lg:py-28">
    <h2 id="experience-heading" class="type-heading text-[2.125rem] lg:col-span-4">{{ experience().heading }}</h2>

    <ol class="lg:col-span-8">
      @for (job of experience().jobs; track job.company) {
        <li class="relative border-l border-stroke pb-14 pl-7 last:pb-0 sm:pl-9">
          <span class="absolute -left-[5px] top-2 size-[9px] rounded-full" [class.bg-signal]="$first" [class.bg-graphite]="!$first" aria-hidden="true"></span>
          <p class="type-condensed text-graphite">{{ job.period }}</p>
          <h3 class="type-heading mt-2 text-[1.6875rem]">{{ job.role }}</h3>
          <p class="mt-1 text-lg">{{ job.company }}<span class="text-graphite">, {{ job.location }}</span></p>
          <ul class="mt-6 max-w-[40rem] space-y-3 text-graphite">
            @for (highlight of job.highlights; track $index) {
              <li class="relative pl-5 before:absolute before:left-0 before:top-[0.8em] before:h-px before:w-2.5 before:bg-graphite">{{ highlight }}</li>
            }
          </ul>
        </li>
      }
    </ol>
  </div>
</section>

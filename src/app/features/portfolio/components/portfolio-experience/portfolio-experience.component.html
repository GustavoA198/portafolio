<section class="py-24 md:py-28 xl:py-32 px-6 sm:px-8 md:px-16 xl:px-24 2xl:px-32 bg-surface-container-low" id="experience">
  <div class="max-w-7xl 2xl:max-w-[96rem] mx-auto grid lg:grid-cols-12 gap-12 xl:gap-16">
    <div class="lg:col-span-7">
      <h2 class="text-3xl sm:text-4xl 2xl:text-5xl font-headline font-bold text-white mb-12 xl:mb-16 flex items-center gap-4">
        <span class="w-12 h-[2px] bg-primary"></span> Línea de tiempo profesional
      </h2>
      <div class="relative space-y-12 md:space-y-16 pl-8">
        <div class="absolute left-0 top-2 bottom-2 w-[1px] bg-primary/30"></div>
        @for (entry of timeline; track entry.year) {
          <div class="relative">
            <div class="absolute -left-[37px] top-2 w-4 h-4 rounded-full ring-8 ring-surface-container-low" [style.backgroundColor]="entry.emphasis ? 'rgba(85, 230, 165, 0.5)' : '#55e6a5'"></div>
            <span class="font-headline text-sm font-bold block mb-2" [style.color]="entry.emphasis ? 'rgba(85, 230, 165, 0.7)' : '#55e6a5'">{{ entry.year }}</span>
            <h3 class="text-2xl font-bold text-white mb-2">{{ entry.title }}</h3>
            <p class="text-on-surface-variant max-w-lg">{{ entry.description }}</p>
          </div>
        }
      </div>
    </div>
    <div class="lg:col-span-5" id="stack">
      <h2 class="text-3xl sm:text-4xl 2xl:text-5xl font-headline font-bold text-white mb-12 xl:mb-16">Stack técnico</h2>
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 xl:gap-5">
        @for (skill of skills; track skill.name) {
          <div class="bg-surface-container-high p-6 rounded-xl min-h-[10rem] hover:bg-surface-bright transition-colors group">
            <span class="material-symbols-outlined text-primary mb-4 block group-hover:scale-110 transition-transform" [attr.data-icon]="skill.icon">{{ skill.icon }}</span>
            <p class="font-bold text-white">{{ skill.name }}</p>
            <p class="text-xs text-on-surface-variant mt-1">{{ skill.detail }}</p>
          </div>
        }
      </div>
    </div>
  </div>
</section>
